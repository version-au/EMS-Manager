name: "EMS Manager"
version: "0.11.0"
slug: "ems_manager"
description: "Schedule-driven EMS work mode, battery discharge, and grid import/export limit management for Sigenergy (Local Modbus) and GoodWe inverters"
url: "https://github.com/version-au/EMS-Manager"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-charging-100
panel_title: "EMS Manager"
homeassistant_api: true
options:
  poll_interval_seconds: 20
  log_level: info
  power_entities_unit: "kW"
schema:
  poll_interval_seconds: int(5,300)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  power_entities_unit: list(W|kW)
